name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PcHouseStore.sln
      - run: dotnet build PcHouseStore.sln --no-restore --configuration Release
      - run: dotnet test PcHouseStore.sln --no-build --configuration Release
      - run: dotnet format PcHouseStore.sln --verify-no-changes --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pchousestore-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/pchousestore-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  format_frontend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/phase2/technical-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend/pchousestore-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/technical-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/pchousestore-web/package-lock.json
      - run: npm ci
      - run: npm run format
      - name: Commit Prettier formatting
        working-directory: .
        run: |
          if git diff --quiet -- frontend/pchousestore-web; then
            echo "Frontend formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pchousestore-web
          git commit -m "style(frontend): apply Prettier formatting"
          git push origin HEAD:phase2/technical-foundation
