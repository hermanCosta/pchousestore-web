name: One-time Prettier inspection

on:
  push:
    branches:
      - phase2/technical-foundation

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pchousestore-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/pchousestore-web/package-lock.json
      - run: npm ci
      - run: npx prettier --write src/app/App.tsx src/app/App.test.tsx
      - name: Print formatted source for exact patching
        run: |
          echo '===== APP.TSX START ====='
          cat src/app/App.tsx
          echo '===== APP.TSX END ====='
          echo '===== APP.TEST.TSX START ====='
          cat src/app/App.test.tsx
          echo '===== APP.TEST.TSX END ====='
