name: One-time Prettier fix

on:
  push:
    branches:
      - phase2/technical-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/pchousestore-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/technical-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/pchousestore-web/package-lock.json
      - run: npm ci
      - run: npx prettier --write src/app/App.tsx src/app/App.test.tsx
      - name: Commit canonical formatting
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pchousestore-web/src/app/App.tsx frontend/pchousestore-web/src/app/App.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(shell): apply Prettier formatting [skip ci]"
            git push origin HEAD:phase2/technical-foundation
          fi
